  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; } body { background: #040d18; }
  .hide-mobile { display: inline; }
  .show-mobile { display: none; }
  @media (max-width: 600px) {
    .hide-mobile { display: none; }
    .show-mobile { display: inline; }
  }
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0px 1000px rgba(30, 50, 40, 0.9) inset !important;
    -webkit-text-fill-color: #f0e6c8 !important;
    transition: background-color 5000s ease-in-out 0s;
  }
  @keyframes borderPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.5); }
    50%       { box-shadow: 0 0 0 6px rgba(201,168,76,0.0); }
  }
  .name-input-empty { animation: borderPulse 2s ease-in-out infinite; }
  .name-input-filled { animation: none; }

  /* ── PRINT / PDF REPORT ─────────────────────────────────────────────────── */
  #print-report { display: none; }

  @media print {
    /* Hide everything except the report */
    body > #root { display: none !important; }
    #print-report {
      display: block !important;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #1a1a2e;
      background: white;
      padding: 0;
      margin: 0;
    }
    /* Force white background, black text throughout */
    #print-report * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* Page breaks */
    .pr-page-break { page-break-before: always; }
    .pr-no-break   { page-break-inside: avoid; }

    /* Header */
    .pr-header {
      background: #040d18 !important;
      color: white !important;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid #c9a84c;

      background: #c9a84c !important;
      color: #040d18 !important;
      border-radius: 8px;
      padding: 6px 14px;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 4px;
      font-family: sans-serif;

    /* CUBE SVG wrapper */

      gap: 16px;
      flex-wrap: wrap;

    /* Paper card (student response) */
    .pr-paper {
      margin: 0 28px 20px;

    /* Literacy table */

    .pr-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 12px; }
    .pr-table th { background: #f0e6c8 !important; color: #040d18 !important; padding: 10px 12px; text-align: left; font-weight: 800; letter-spacing: 0.5px; border-bottom: 2px solid #c9a84c; }

    .pr-anno-table th.center { text-align: center; width: 48px; }

    .pr-anno-xp-row td { font-family: sans-serif; font-size: 11px; font-weight: 700; color: #444 !important; padding: 6px 10px; border-top: 2px solid #c9a84c; background: #f8f4ec !important; }

    .pr-score-circle {

    .pr-change-grid    { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

</style>

<body>
  <div id="root"></div>
  <div id="print-report"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel">
const { useState, useRef, useEffect } = React;

// ─── CONFIG — loaded from config.json at startup ──────────────────────────────
// config.json lives in the same directory as index.html (one per subject repo).
// It contains: subjectCode, subjectName, syllabus, bandRules, leaderboardUrl,
//              sheetTabFull, leaderboardTip, directiveTiers, connectives
// This index.html is subject-agnostic — do not add subject-specific logic here.
let config = {
  subjectCode: "EES",
  subjectName: "HSC Marking Coach",
  subjectShortName: "EES",
  leaderboardTip: "",
  leaderboardUrl: "",
  logUrl: "",
  sheetTabFull: "EES",
  syllabus: {},
  bandRules: {},
  directiveTiers: {},
  connectives: { preferred:["so","because","but"], accepted:[], contrast:[] },
};

// Load config.json from same directory — runs once before React mounts
async function loadConfig() {
  try {
    // Read ?subject=EES (or BS/HM/ES) from the URL — default to EES
    const params  = new URLSearchParams(window.location.search);
    const subject = (params.get("subject") || "EES").toUpperCase().replace(/[^A-Z0-9]/g,"");
    // Map short URL codes to config filenames
    const CONFIG_FILES = { EES:"config-EES", BS:"config-BusS", BUSS:"config-BusS", HM:"config-HlthM", HLTHM:"config-HlthM", ES:"config-EngS", ENGS:"config-EngS", CF:"config-ComFam", COMFAM:"config-ComFam" };
    const configName  = CONFIG_FILES[subject] || "config-EES";
    const configFile  = "../" + configName + ".json?v=" + Date.now();
    const res = await fetch(configFile);
    if (!res.ok) throw new Error(configName + ".json not found (HTTP " + res.status + ")");
    const data = await res.json();
    config = { ...config, ...data };
    console.log("✅ Config loaded:", config.subjectCode, config.subjectName);
  } catch(e) {
    console.error("❌ Failed to load config:", e.message);
  }
}

// ─── CONSTANTS (subject-independent) ─────────────────────────────────────────
const BAND_MAP = [[0,5,"Band 2"],[6,9,"Band 3"],[10,13,"Band 4"],[14,17,"Band 5"],[18,20,"Band 6"]];
const getBand = (score, maxScore=20) => {
  const scaled = maxScore > 0 ? Math.round((score / maxScore) * 20) : 0;
  return BAND_MAP.find(([lo,hi])=>scaled>=lo&&scaled<=hi)?.[2] || "Band 2";
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────

// Read EXIF orientation tag from raw JPEG buffer (handles all 8 values)
const getExifOrientation = (buffer) => {
  try {
    const view = new DataView(buffer);
    if (view.getUint16(0, false) !== 0xFFD8) return 1; // not a JPEG
    let offset = 2;
    while (offset < view.byteLength - 2) {
      const marker = view.getUint16(offset, false);
      offset += 2;
      if (marker === 0xFFE1) { // APP1 block — contains EXIF
        const exifStart = offset + 2;
        if (view.getUint32(exifStart, false) !== 0x45786966) return 1; // no "Exif" header
        const little = view.getUint16(exifStart + 6, false) === 0x4949;
        const ifdOffset = view.getUint32(exifStart + 10, little) + exifStart + 6;
        const entries = view.getUint16(ifdOffset, little);
        for (let i = 0; i < entries; i++) {
          const tag = view.getUint16(ifdOffset + 2 + i * 12, little);
          if (tag === 0x0112) { // Orientation tag
            return view.getUint16(ifdOffset + 2 + i * 12 + 8, little);
          }
        }
        return 1;
      } else if ((marker & 0xFF00) !== 0xFF00) break;
      else offset += view.getUint16(offset, false);
    }
  } catch (e) { /* ignore parse errors — treat as normal orientation */ }
  return 1;
};

// Apply canvas transform for EXIF orientation before drawing image
// Orientations 5-8 are rotated 90/270° so canvas width/height must be swapped
const applyExifTransform = (canvas, ctx, orientation, w, h) => {
  switch (orientation) {
    case 2: ctx.transform(-1, 0, 0,  1, w, 0); break;           // flip horizontal
    case 3: ctx.transform(-1, 0, 0, -1, w, h); break;           // 180°
    case 4: ctx.transform( 1, 0, 0, -1, 0, h); break;           // flip vertical
    case 5: ctx.transform( 0, 1, 1,  0, 0, 0); break;           // transpose
    case 6: ctx.transform( 0, 1,-1,  0, h, 0); break;           // 90° clockwise
    case 7: ctx.transform( 0,-1,-1,  0, h, w); break;           // transverse
    case 8: ctx.transform( 0,-1, 1,  0, 0, w); break;           // 90° counter-clockwise
    default: break;                                               // 1 = normal, no transform
  }
};

const toB64 = f => new Promise((res, rej) => {
  // Read file as ArrayBuffer first to extract EXIF orientation, then as image for drawing
  const reader = new FileReader();
  reader.onload = (e) => {
    const buffer = e.target.result;
    const orientation = getExifOrientation(buffer);
    const rotated = orientation >= 5; // orientations 5-8 swap width/height

    const blob = new Blob([buffer], { type: f.type });
    const objectUrl = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      const MAX_W = 1600;
      // Raw pixel dimensions (before any rotation correction)
      const rawW = img.width;
      const rawH = img.height;
      // After correction, the "display" dimensions may be swapped
      const dispW = rotated ? rawH : rawW;
      const dispH = rotated ? rawW : rawH;
      const scale = dispW > MAX_W ? MAX_W / dispW : 1;
      const outW = Math.round(dispW * scale);
      const outH = Math.round(dispH * scale);

      const canvas = document.createElement("canvas");
      canvas.width = outW;
      canvas.height = outH;
      const ctx = canvas.getContext("2d");
      ctx.save();
      applyExifTransform(canvas, ctx, orientation, outW, outH);
      // Draw scaled to output size (ctx transform handles rotation)
      if (rotated) {
        ctx.drawImage(img, 0, 0, rawW * scale, rawH * scale);
      } else {
        ctx.drawImage(img, 0, 0, outW, outH);
      }
      ctx.restore();
      const dataUrl = canvas.toDataURL("image/jpeg", 0.90);
      res(dataUrl.split(",")[1]);
    };
    img.onerror = rej;
    img.src = objectUrl;
  };
  reader.onerror = rej;
  reader.readAsArrayBuffer(f);
});

const sanitiseInput = (str) => String(str || "").replace(/[`${}\\]/g, "").trim().slice(0, 200);

const privacyName = (fullName) => {
  const parts = fullName.trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "anonymous";
  if (parts.length === 1) return parts[0];
  return parts[0] + " " + parts[parts.length - 1][0].toUpperCase();
};

// ─── SVG CONSTANTS ────────────────────────────────────────────────────────────
const FONT_SIZE = 17;
const CW = 10.2;
const LH = 38;
const PL = 44;
const PT = 58;
const CPL = 50;


// ─── SVG ANNOTATION ENGINE ────────────────────────────────────────────────────
function buildLines(text, cplOverride) {
  const CPL_USE = cplOverride || CPL;
  if (!text) return [];
  const lines = [];
  const words = text.split(/(\s+)/); // alternating words and spaces
  let lineText = "";
  let lineStart = 0;
  let charPos = 0;
  words.forEach(token => {
    if (!token) { charPos += token.length; return; }
    if (/^\s+$/.test(token)) {
      // space token
      if (lineText.length + token.length > CPL) {
        // flush line, skip the whitespace
        if (lineText) lines.push({ text: lineText, start: lineStart });
        lineStart = charPos + token.length;
        lineText = "";
      } else {
        lineText += token;
      }
    } else {
      // word token
      if (lineText.length + token.length > CPL_USE && lineText.trim()) {
        lines.push({ text: lineText, start: lineStart });
        lineStart = charPos;
        lineText = token;
      } else {
        if (!lineText) lineStart = charPos;
        lineText += token;
      }
    }
    charPos += token.length;
  });
  if (lineText.trim()) lines.push({ text: lineText, start: lineStart });
  return lines;
}

function getXY(idx, lines, yOff = 0) {
  if (!lines.length) return { x: PL, y: PT + yOff, li: 0 };
  for (let i = 0; i < lines.length; i++) {
    const end = lines[i].start + lines[i].text.length;
    if (idx < end || i === lines.length - 1) {
      const col = Math.max(0, idx - lines[i].start);
      // Round to nearest 0.5px to prevent sub-pixel drift on long lines
      return { x: PL + Math.round(col * CW * 2) / 2, y: PT + yOff + i * LH, li: i };
    }
  }
  return { x: PL, y: PT + yOff, li: 0 };
}

function SVGAnnotatedPaper({ text, directives, syllabusKeywords, constraints, planningArrows, mode,
                              // legacy fallback props
                              directive, syllabusMatch }) {
  if (!text) return null;

  // ── normalise to new schema, fall back to old single-object props ──
  const dirs = directives?.length ? directives
    : directive ? [directive] : [];
  const kwds = syllabusKeywords?.length ? syllabusKeywords
    : syllabusMatch ? [{ ...syllabusMatch, word: syllabusMatch.topicTitle }] : [];

  // Responsive CPL — fewer chars per line on narrow mobile screens
  const isMobile = typeof window !== "undefined" && window.innerWidth < 500;
  const effectiveCPL = isMobile ? 28 : CPL;
  const lines = buildLines(text, effectiveCPL);
  const nLines = Math.max(lines.length, 1);
  const W = PL + effectiveCPL * CW + PL;
  // PLAN_EXTRA: internal coordinate space above text; viewBox crops tight after pill layout
  const PLAN_EXTRA = mode === "plan" ? 280 : 0;
  const H = PT + PLAN_EXTRA + nLines * LH + 30;

  const shapes = [];

  // ── helper: find exact char position of a word near a given index ──────────
  // Searches ±25 chars around hintIdx to find where `word` actually appears.
  // Prefer forward (AI often points just before the word); fall back to backward.
  const findExact = (word, hintIdx) => {
    if (!word || hintIdx == null) return hintIdx;
    const wl = word.toLowerCase();
    const ql = text.toLowerCase();
    // Forward pass first (most common: AI points to word before)
    for (let d = 0; d <= 40; d++) {
      const i = hintIdx + d;
      if (ql.slice(i, i + wl.length) === wl) return i;
    }
    // Backward pass (less common: AI overshoots)
    for (let d = 1; d <= 20; d++) {
      const i = hintIdx - d;
      if (i >= 0 && ql.slice(i, i + wl.length) === wl) return i;
    }
    // Full scan fallback — if hint is badly wrong, find first occurrence
    const fullIdx = ql.indexOf(wl);
    if (fullIdx >= 0) return fullIdx;
    return hintIdx; // fallback: trust AI
  };

  // ── C: red ovals — one per directive verb ────────────────────────────────
  // s.y from getXY = SVG text baseline (y attr of <text> element)
  // Cap-height midpoint ≈ baseline - FONT_SIZE*0.36 ≈ baseline - 6px
  // ry should span from descender to ascender: ~FONT_SIZE*0.75
  dirs.forEach((dv, di) => {
    if (dv.startIndex == null || !dv.word) return;
    const exactStart = findExact(dv.word, dv.startIndex);
    const s = getXY(exactStart, lines, PLAN_EXTRA);
    const wPx = dv.word.length * CW;
    const rx = wPx/2 + 10;
    const ry = FONT_SIZE * 0.80;   // compact — spans the letter body
    const cy = s.y - FONT_SIZE * 0.36;  // centred on cap-height midpoint
    const cx = Math.max(s.x + wPx/2, PL - 8 + rx);
    shapes.push(
      <ellipse key={`circle${di}`}
        cx={cx} cy={cy} rx={rx} ry={ry}
        fill="rgba(192,57,43,0.08)" stroke="#c0392b" strokeWidth="2.5"/>
    );
  });

  // ── U: blue underlines — one per syllabus keyword ────────────────────────
  // s.y = baseline; underline sits just below baseline (+3px)
  kwds.forEach((kw, ki) => {
    if (kw.startIndex == null) return;
    const wordStr = kw.word || kw.topicTitle || "";
    const exactStart = findExact(wordStr, kw.startIndex);
    const exactEnd = exactStart + wordStr.length;
    const s = getXY(exactStart, lines, PLAN_EXTRA);
    // Use exactEnd-1 so the end coord always resolves to the last char's line,
    // not the start of the next line (which caused a phantom empty segment).
    const eRaw = getXY(Math.max(exactStart, exactEnd - 1), lines, PLAN_EXTRA);
    const e = { ...eRaw, x: eRaw.x + CW };
    for (let l = s.li; l <= e.li && l < lines.length; l++) {
      const x1 = l === s.li ? s.x : PL;
      const rawX2 = l === e.li ? e.x : PL + lines[l].text.trimEnd().length * CW;
      const x2 = rawX2 - 4;  // slight trim to avoid bleeding into next word
      const yBase = PT + PLAN_EXTRA + l * LH;  // baseline for this line
      const y = yBase + 4;   // just below baseline
      shapes.push(<line key={`u${ki}_${l}`} x1={x1} y1={y} x2={x2} y2={y} stroke="#1a6db5" strokeWidth="3" strokeLinecap="round"/>);
    }
  });

  // ── B: green boxes — constraints ─────────────────────────────────────────
  // s.y = baseline; box spans from ascender top to descender bottom
  const SKIP_WORDS = new Set(["to","on","the","a","an","of","in","at","by","for","it","is"]);
  // Build set of keyword text (lowercase) so we never box words already underlined
  const kwdTexts = new Set((syllabusKeywords||[]).map(k=>(k.word||"").trim().toLowerCase()));
  const dirTexts = new Set((directives||[]).map(d=>(d.word||"").trim().toLowerCase()));
  (constraints || []).forEach((ct, ci) => {
    if (ct.startIndex == null) return;
    const trimmed = (ct.text||"").trim();
    const tl = trimmed.toLowerCase();
    // Skip if this word is already a directive (circled) or syllabus keyword (underlined)
    if (SKIP_WORDS.has(tl) || kwdTexts.has(tl) || dirTexts.has(tl)) return;
    const exactStart = findExact(trimmed, ct.startIndex);
    const exactEnd   = exactStart + trimmed.length;
    const s = getXY(exactStart, lines, PLAN_EXTRA);
    // Use exactEnd-1 so the end coord always resolves to the last char's line,
    // not the start of the next line (which caused a phantom empty box).
    const eRaw = getXY(Math.max(exactStart, exactEnd - 1), lines, PLAN_EXTRA);
    const e = { ...eRaw, x: eRaw.x + CW };
    const drawEnd = e.li;  // use actual end line — allows multi-word constraints to span lines
    for (let l = s.li; l <= drawEnd && l < lines.length; l++) {
      const x1 = (l === s.li ? s.x : PL) - 6;
      const x2 = (l === drawEnd ? e.x : PL + lines[l].text.trimEnd().length * CW) + 6;
      const yBase = PT + PLAN_EXTRA + l * LH;
      const boxTop = yBase - FONT_SIZE * 0.85;  // top of ascenders
      const boxH   = FONT_SIZE * 1.15;           // ascender to descender, stops above underline
      shapes.push(<rect key={`b${ci}_${l}`} x={x1} y={boxTop} width={Math.max(x2-x1, 12)} height={boxH} rx="4" fill="rgba(46,125,50,0.07)" stroke="#2e7d32" strokeWidth="2"/>);
    }
  });

  // ── E: Planning notes (plan mode only) ──────────────────────────────────────
  const notes = [];
  let allPills = [];

  if (mode === "plan" && Array.isArray(planningArrows) && planningArrows.length) {
    const FS = 10, CH = 6.0, LH_N = 13, PAD_X = 7, PAD_Y = 5;
    const MAX_CHARS = 14, BOX_GAP = 8, ROW_GAP = 4;

    const splitLabel = (label) => {
      if (label.length <= MAX_CHARS) return [label];
      const mid = Math.floor(label.length / 2);
      let split = -1;
      for (let d = 0; d <= 8; d++) {
        if (label[mid+d]==='→'||label[mid+d]===' '){split=mid+d+1;break;}
        if (label[mid-d]==='→'||label[mid-d]===' '){split=mid-d+1;break;}
      }
      if (split < 1) split = MAX_CHARS;
      return [label.slice(0,split).trim(), label.slice(split).trim()].filter(Boolean);
    };

    // Split pills into above (even-index) and below (odd-index) groups
    // ALL above pills float above line 0; ALL below pills float below the last line
    // Each pill is centred horizontally on its target word with a straight vertical arrow

    const rawPills = planningArrows
      .filter(a => a.targetStartIndex != null && a.label)
      .map((a, gi) => {
        const idx = a.targetWord ? findExact(a.targetWord, a.targetStartIndex) : a.targetStartIndex;
        const pos = getXY(idx, lines, PLAN_EXTRA);
        const ls  = splitLabel(a.label);
        const bw  = Math.max(Math.max(...ls.map(l=>l.length)) * CH + PAD_X*2, 52);
        const bh  = ls.length * LH_N + PAD_Y * 2;
        // Arrow tip: centre of the target word
        const tx  = pos.x + (a.targetWord ? a.targetWord.length * CW / 2 : 6);
        const goBelow = gi % 2 === 1;
        return { ls, bw, bh, tx, bx: tx - bw/2, by:0, row:0, tLine:pos.li, goBelow, stemFromY:0, stemToY:0 };
      });

    const abovePills = rawPills.filter(p => !p.goBelow).sort((a,b) => a.tx - b.tx);
    const belowPills = rawPills.filter(p =>  p.goBelow).sort((a,b) => a.tx - b.tx);

    // Resolve horizontal overlaps within each group by nudging right
    const resolveOverlaps = (pills) => {
      for (let i = 1; i < pills.length; i++) {
        const prev = pills[i-1], cur = pills[i];
        const minX = prev.bx + prev.bw + BOX_GAP;
        if (cur.bx < minX) cur.bx = Math.min(minX, W - cur.bw - 2);
      }
      // Clamp left edge
      pills.forEach(p => { p.bx = Math.max(PL, Math.min(p.bx, W - p.bw - 2)); });
    };
    resolveOverlaps(abovePills);
    resolveOverlaps(belowPills);

    // Y positions
    // Above: two tiers — row 0 closest to text, row 1 further up
    // Assign tiers by detecting horizontal overlap between sorted pills
    const ROW_H    = Math.max(...rawPills.map(p=>p.bh), 26) + ROW_GAP + 4;
    const textTopY = PT + PLAN_EXTRA - FONT_SIZE * 0.9 - 6;
    const textBotY = PT + PLAN_EXTRA + nLines * LH + 4;
    const STEM_GAP = 10;

    // Assign above pills to row 0 or row 1 to avoid overlap
    // Sort by x, greedily assign to row 0; if it overlaps last row-0 pill, put in row 1
    const row0Right = { 0: PL - BOX_GAP, 1: PL - BOX_GAP };
    abovePills.forEach(p => {
      if (p.bx >= row0Right[0] + BOX_GAP) {
        p.row = 0; row0Right[0] = p.bx + p.bw;
      } else if (p.bx >= row0Right[1] + BOX_GAP) {
        p.row = 1; row0Right[1] = p.bx + p.bw;
      } else {
        // both rows occupied at this x — pick whichever has more space
        p.row = row0Right[0] <= row0Right[1] ? 0 : 1;
        row0Right[p.row] = p.bx + p.bw;
      }
    });

    // row 0 = closest to text (lower y), row 1 = further up (higher y)
    abovePills.forEach(p => {
      p.by        = textTopY - STEM_GAP - p.bh - p.row * ROW_H;
      p.stemFromY = p.by + p.bh;
      p.stemToY   = PT + PLAN_EXTRA + p.tLine * LH - FONT_SIZE * 0.9 - 2;
    });

    belowPills.forEach(p => {
      p.by        = textBotY + STEM_GAP;
      p.stemFromY = p.by;                 // top of pill
      p.stemToY   = PT + PLAN_EXTRA + p.tLine * LH + LH * 0.2; // bottom of target word line
    });

    allPills = [...abovePills, ...belowPills];

    // Render
    allPills.forEach((p, i) => {
      const cx   = p.bx + p.bw / 2;  // centre of pill (may differ from tx after nudging)
      const arrowUp = !p.goBelow;     // arrow points toward text
      const tipY  = p.stemToY;
      const lineY = p.stemFromY;
      const polyPts = arrowUp
        ? `${p.tx-5},${tipY-8} ${p.tx+5},${tipY-8} ${p.tx},${tipY}`   // ↓ into text
        : `${p.tx-5},${tipY+8} ${p.tx+5},${tipY+8} ${p.tx},${tipY}`;  // ↑ into text
      notes.push(
        <g key={`n${i}`}>
          {/* Diagonal line from pill centre to arrowhead */}
          <line x1={cx} y1={arrowUp ? lineY : lineY}
                x2={p.tx} y2={arrowUp ? tipY-8 : tipY+8}
            stroke="#c9a84c" strokeWidth="1.5" strokeDasharray="4,3"/>
          <polygon points={polyPts} fill="#c9a84c"/>
          <rect x={p.bx} y={p.by} width={p.bw} height={p.bh} rx="6" fill="#fff8e1" stroke="#c9a84c" strokeWidth="1.5"/>
          {p.ls.map((ln,li)=>(
            <text key={li} x={p.bx+PAD_X} y={p.by+PAD_Y+li*LH_N+FS}
              fontSize={FS} fontFamily="sans-serif" fontWeight="700" fill="#7a5000">{ln}</text>
          ))}
        </g>
      );
    });
  }

  // ViewBox: above pills sit above line 0, below pills sit below last line
  const _textTop = PT + PLAN_EXTRA - FONT_SIZE;
  const _minY    = allPills.length ? Math.min(_textTop, ...allPills.map(p=>p.by)) : _textTop;
  const _maxY    = allPills.length
    ? Math.max(PT + PLAN_EXTRA + nLines * LH + 16, ...allPills.map(p=>p.by + p.bh + 10))
    : PT + PLAN_EXTRA + nLines * LH + 16;
  const cropTop  = Math.max(0, _minY - 6);
  const svgH     = _maxY - cropTop;

  return (
    <div style={{background:"#fffef5", borderRadius:"16px", boxShadow:"0 4px 20px rgba(0,0,0,0.3)", border:"1px solid #e8e0c8", marginBottom:"16px", overflowX:"auto"}}>
      <svg width="100%" height={svgH} viewBox={`0 ${cropTop} ${W} ${svgH}`} style={{display:"block", minWidth:280}}>
        {Array.from({length: nLines+1}, (_,i) => (
          <line key={`rl${i}`} x1="0" y1={PT+PLAN_EXTRA+i*LH+8} x2={W} y2={PT+PLAN_EXTRA+i*LH+8} stroke="rgba(160,185,220,0.3)" strokeWidth="1"/>
        ))}
        <line x1={PL-10} y1={cropTop} x2={PL-10} y2={cropTop+svgH} stroke="rgba(210,70,70,0.22)" strokeWidth="1.5"/>
        <text x={PL-8} y={PT+PLAN_EXTRA-10} fontSize="9" fontFamily="sans-serif" fontWeight="700" fill="#ccc" letterSpacing="1.5">{mode==="cube"?"CUBE":"PLAN"}</text>
        {lines.map((ln,i) => (
          <text key={i} x={PL} y={PT+PLAN_EXTRA+i*LH}
            fontSize={FONT_SIZE} fontFamily="'Courier New',Courier,monospace" fill="#1a1a2e"
            textLength={ln.text.length*CW} lengthAdjust="spacing">{ln.text}</text>
        ))}
        {shapes}
        {notes}
      </svg>
    </div>
  );
}

// ─── FORMATTED RESPONSE with bold connectives + italic noun groups ────────────
// Also detects runs of 3+ spaces left by AI for illegible words → converts to [?]
function normaliseIllegible(text) {
  if (!text) return text;
  // Replace 3+ consecutive spaces with [?] — AI commonly leaves gaps for illegible words
  return text.replace(/ {3,}/g, ' [?] ');
}

// Post-process formattedResponse: if AI forgot _italic_ markers for noun groups,
// wrap them based on detectedNounGroups list. Also ensure [?] from studentText carries through.
function enrichFormattedResponse(formatted, studentText, nounGroups, connectives) {
  // Pick best source
  const hasMarkup = t => t && (t.includes('**') || t.includes('_') || t.includes('[?]'));
  let text = hasMarkup(formatted) ? formatted
           : hasMarkup(studentText) ? studentText
           : formatted || studentText || '';
  // Normalise illegible gaps — 3+ spaces → [?]
  text = normaliseIllegible(text);

  // Always inject bold connectives client-side if not already present
  const allConnectives = [
    ...(connectives?.preferred || ["so","because","but"]),
    ...(connectives?.accepted  || ["therefore","thus","hence","however","although","consequently","as a result","which means","resulting in","leading to","due to","since","yet"])
  ];
  allConnectives.forEach(conn => {
    const escaped = conn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // Only wrap if not already bolded
    text = text.replace(new RegExp(`(?<!\\*)(\\b${escaped}\\b)(?!\\*)`, 'gi'), '**$1**');
  });

  // Inject italic noun groups if missing
  if (nounGroups && nounGroups.length > 0 && !text.includes('_')) {
    // Sort longest first to avoid partial matches
    const sorted = [...nounGroups].sort((a,b) => b.length - a.length);
    sorted.forEach(ng => {
      if (!ng || ng.length < 2) return;
      const escaped = ng.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      text = text.replace(new RegExp(`(?<![_*])(${escaped})(?![_*])`, 'gi'), '_$1_');
    });
  }
  return text;
}
function FormattedResponse({ text }) {
  if (!text) return null;
  const cleaned = normaliseIllegible(text);
  const parts = [];
  const regex = /\*\*([^*]+)\*\*|_([^_]+)_|\[\?\]/g;
  let last = 0, m;
  while ((m = regex.exec(cleaned)) !== null) {
    if (m.index > last) parts.push(<span key={last}>{cleaned.slice(last, m.index)}</span>);
    if (m[0] === '[?]') {
      parts.push(<span key={m.index} style={{background:"#ff6d00",color:"white",borderRadius:"4px",padding:"1px 6px",fontWeight:900,fontFamily:"sans-serif",fontSize:"11px",margin:"0 2px",verticalAlign:"middle"}}>?</span>);
    } else if (m[1]) {
      // Bold connective — purple highlight, visible on cream paper
      parts.push(<strong key={m.index} style={{color:"#d580ff",background:"rgba(180,80,255,0.18)",padding:"0 3px",borderRadius:"3px",fontFamily:"sans-serif"}}>{m[1]}</strong>);
    } else {
      // Italic noun group — dark teal, dotted underline, clearly visible on cream
      parts.push(<em key={m.index} style={{color:"#64b5f6",textDecoration:"underline",textDecorationStyle:"dotted",textDecorationColor:"#64b5f6",fontStyle:"italic"}}>{m[2]}</em>);
    }
    last = m.index + m[0].length;
  }
  if (last < cleaned.length) parts.push(<span key="end">{cleaned.slice(last)}</span>);
  return <>{parts}</>;
}

// ─── STEP INDICATOR ──────────────────────────────────────────────────────────
function Steps({current, activeTab, onTabChange}) {
  const steps = ["Upload","CUBE","Plan","Script","Rubric","Feedback","🏆"];
  const tabToStep = {cube:1, plan:2, script:3, rubric:4, feedback:5, rank:6};
  const stepToTab = {1:"cube", 2:"plan", 3:"script", 4:"rubric", 5:"feedback", 6:"rank"};
  const highlight = activeTab ? (tabToStep[activeTab] ?? current) : current;
  return <div style={{display:"flex",alignItems:"center",gap:"0",marginBottom:"20px",padding:"14px 8px",background:"rgba(255,255,255,0.04)",borderRadius:"16px",border:"1px solid rgba(255,255,255,0.08)"}}>
    {steps.map((s,i)=>{
      const done = i < highlight;
      const active = i === highlight;
      const clickable = i > 0 && !!onTabChange;
      return <div key={s} style={{display:"flex",alignItems:"center",flex:i<steps.length-1?1:"auto"}}>
        <div onClick={clickable ? ()=>onTabChange(stepToTab[i]) : undefined}
          style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"6px",cursor:clickable?"pointer":"default"}}>
          <div style={{position:"relative",width:"56px",height:"56px"}}>
            <div style={{width:"56px",height:"56px",borderRadius:"50%",
              background: s==="🏆" ? (active?"linear-gradient(135deg,#6c63ff,#9c27b0)":done?"linear-gradient(135deg,#4a0e7a,#6c63ff)":"rgba(108,99,255,0.15)") : active?"#c9a84c": done?"#4caf50":"rgba(255,255,255,0.08)",
              border:`2px solid ${s==="🏆"?(active||done?"#6c63ff":"rgba(108,99,255,0.3)"):active?"#c9a84c":done?"#4caf50":"rgba(255,255,255,0.15)"}`,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize: s==="🏆" ? "26px" : "22px",fontWeight:900,
              color: s==="🏆" ? "white" : active||done?"#0d1b2a":"#ffffff",
              boxShadow: active?"0 4px 14px rgba(201,168,76,0.5)":done?"0 2px 8px rgba(76,175,80,0.4)":"none",
              transition:"all 0.3s"}}>
              {s==="🏆" ? "🏆" : i+1}
            </div>
            {done&&<div style={{position:"absolute",top:"-4px",right:"-4px",width:"20px",height:"20px",borderRadius:"50%",background:"#2e7d32",border:"2px solid #0d1b2a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",fontWeight:900,color:"white",lineHeight:1}}>✓</div>}
          </div>
          <div style={{fontSize:"13px",
            color: s==="🏆" ? (active?"#a89fff":done?"#a89fff":"#e8eaf0") : (active?"#c9a84c":done?"#4caf50":"#e8eaf0"),
            fontFamily:"sans-serif",fontWeight:active||done?700:400,whiteSpace:"nowrap"}}>{s==="🏆"?"Score":s}</div>
        </div>
        {i<steps.length-1&&<div style={{flex:1,height:"3px",
          background: done?"#c9a84c":"rgba(255,255,255,0.15)",
          margin:"0 4px",marginBottom:"22px",borderRadius:"2px",transition:"all 0.3s"}}/>}
      </div>;
    })}
  </div>;
}

// ─── RUBRIC ROW ──────────────────────────────────────────────────────────────
function RubricRow({label, data, applicable=true, dimMax=5}) {
  // Cap raw Sonnet score at dimMax (scales with question marks value)
  const rawScore = data?.score||0;
  const score    = Math.min(rawScore, dimMax);
  const xpEarned = !applicable ? null : score;
  if (!applicable) return <tr>
    <td style={{padding:"10px 14px",color:"#c8d8e8",fontSize:"13px",fontFamily:"sans-serif"}}>{label}</td>
    <td style={{padding:"10px 14px",textAlign:"center"}}><span style={{color:"#555",fontSize:"12px",fontStyle:"italic"}}>N/A</span></td>
    <td style={{padding:"10px 14px",textAlign:"center",color:"#444",fontSize:"13px",fontFamily:"sans-serif"}}>—</td>
    <td style={{padding:"10px 14px",color:"#555",fontSize:"13px",fontStyle:"italic",fontFamily:"sans-serif"}}>Not applicable for this directive verb</td>
  </tr>;
  return <tr>
    <td style={{padding:"10px 14px",color:"#e8eaf0",fontSize:"13px",fontFamily:"sans-serif",fontWeight:600,borderBottom:"1px solid rgba(255,255,255,0.06)"}}>{label}</td>
    <td style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,0.06)",textAlign:"center"}}><ScoreDot score={score} max={dimMax}/></td>
    <td style={{padding:"10px 14px",textAlign:"center",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
      <span style={{fontWeight:900,fontSize:"15px",color:xpEarned>=dimMax?"#69f0ae":xpEarned>=(dimMax*0.5)?"#ffa726":"#ef5350"}}>+{xpEarned}</span>
      <span style={{fontSize:"10px",color:"#888",fontFamily:"sans-serif",display:"block"}}>XP</span>
    </td>
    <td style={{padding:"10px 14px",color:"#e8eaf0",fontSize:"12px",fontFamily:"sans-serif",lineHeight:"1.5",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
      {data?.evidence&&<div style={{marginBottom:"4px",color:"#c8d8e8",fontStyle:"italic"}}>"{data.evidence}"</div>}
      {data?.comment}
    </td>
  </tr>;
}

// ─── PRINT REPORT ─────────────────────────────────────────────────────────────
// Renders into a hidden #print-report div. @media print hides everything else.
// Called via window.print() triggered by the Download Report button.

function PrintReport({ studentName, questionNumber, subjectName, subjectCode,
                       dirs, kwds, c, a, score, maxScore, dimMaxR,
                       causalApplicable, modalityApplicable,
                       stage2Results, connectives }) {
  if (!a) return null;

  const gold = "#c9a84c";
  const marksKnown = c.marks !== null && c.marks !== undefined;
  const band = marksKnown ? null : getBand(score, maxScore);
  const displayedMark = marksKnown
    ? `${Math.min(Math.round((Math.min(score,maxScore)/maxScore)*c.marks), c.marks)} / ${c.marks} marks`
    : band ? `Indicative ${band}` : "";
  const now = new Date();
  const dateStr = now.toLocaleDateString("en-AU", {day:"2-digit",month:"short",year:"numeric"});
  const timeStr = now.toLocaleTimeString("en-AU", {hour:"2-digit",minute:"2-digit"});

  // ── Literacy rows helper ──
  const litRows = [
    { label:"Causal Connectives",    data:a.rubric?.causalConnectives, applicable:causalApplicable  },
    { label:"Complex Noun Groups",   data:a.rubric?.complexNounGroups, applicable:true              },
    { label:"Modality",              data:a.rubric?.modality,          applicable:modalityApplicable },
    { label:"Logical Flow & Cohesion", data:a.rubric?.logicalFlow,     applicable:true              },
  ];

  // ── Response text renderer (print-safe — no React spans with dark bg) ──
  function PrintResponse({ text }) {
    if (!text) return null;
    const cleaned = normaliseIllegible(text);
    const parts = [];
    const regex = /\*\*([^*]+)\*\*|_([^_]+)_|\[\?\]/g;
    let last = 0, m;
    while ((m = regex.exec(cleaned)) !== null) {
      if (m.index > last) parts.push(<span key={last}>{cleaned.slice(last, m.index)}</span>);
      if (m[0] === '[?]') {
        parts.push(<span key={m.index} className="pr-illegible">?</span>);
      } else if (m[1]) {
        parts.push(<strong key={m.index} className="pr-connective">{m[1]}</strong>);
      } else {
        parts.push(<em key={m.index} className="pr-noun-group">{m[2]}</em>);
      }
      last = m.index + m[0].length;
    }
    if (last < cleaned.length) parts.push(<span key="end">{cleaned.slice(last)}</span>);
    return <>{parts}</>;
  }

  // ── Score circle colour ──
  const scoreCol = (s, max) => {
    const p = max > 0 ? s/max : 0;
    return p >= 0.8 ? "#4caf50" : p >= 0.5 ? "#ff9800" : "#f44336";
  };

  // ── Formatted response for print ──
  const responseText = enrichFormattedResponse(
    a.formattedResponse, a.studentResponseText, a.detectedNounGroups, connectives
  );

  return (

      {/* ── SECTION 1: QUESTION + SCORE ── */}

        <div style={{fontFamily:"sans-serif",fontSize:"12px",color:"#555",marginBottom:"10px",lineHeight:"1.5"}}>
          CUBE the question — the syllabus points underlined below show exactly where this question comes from in the syllabus, so you know where to focus next time.
        </div>
        <div className="pr-question-meta">
          {dirs.map((dv,i) => (
            <span key={i} className="pr-directive-pill">{dv.word}</span>
          ))}

        </div>
        {c.questionText && <div className="pr-question-text">{c.questionText}</div>}
        {kwds.length > 0 && (()=>{
          // Render nesa_descriptor with the matched word underlined inline
          function DescriptorWithUnderline({ descriptor, matchWord }) {
            if (!descriptor) return null;
            if (!matchWord) return <span>{descriptor}</span>;
            const lc = descriptor.toLowerCase();
            const mw = matchWord.toLowerCase();
            const idx = lc.indexOf(mw);
            if (idx === -1) return <span>{descriptor}</span>;
            return <span>
              {descriptor.slice(0, idx)}
              <u style={{textDecorationColor:"#1a6db5",fontWeight:700,color:"#1a6db5"}}>{descriptor.slice(idx, idx + matchWord.length)}</u>
              {descriptor.slice(idx + matchWord.length)}
            </span>;
          }
          return (
            <div style={{marginTop:"12px"}}>
              <div style={{fontFamily:"sans-serif",fontSize:"10px",fontWeight:800,letterSpacing:"1.5px",color:"#1a6db5",marginBottom:"6px",textTransform:"uppercase"}}>Where these underlined words appear in the syllabus</div>

                    <th style={{background:"#e8f0fb",color:"#1a1a2e",padding:"6px 10px",textAlign:"left",fontWeight:800,borderBottom:"2px solid #1a6db5",width:"22%"}}>Syllabus Term</th>

                      </td>

      {/* ── SECTION 3: STUDENT RESPONSE ── */}
      <div className="pr-no-break" style={{margin:"0 28px 20px"}}>

          Below is the text version of your written response. The causal connectives are <strong style={{color:"#7b1fa2"}}>bolded in purple</strong> and the complex noun groups are in <em style={{color:"#1565c0",textDecoration:"underline dotted"}}>italic underline</em>. The <span style={{background:"#ff6d00",color:"white",borderRadius:"3px",padding:"0 4px",fontSize:"10px",fontWeight:900}}>?</span> are words that could not be read.
        </div>
        <div className="pr-paper pr-paper-lines">
          <div className="pr-response-text">
            <PrintResponse text={responseText}/>
          </div>
        </div>
      </div>

      {/* ── SECTION 4: LITERACY SCORES ── */}
      <div className="pr-literacy-section pr-page-break pr-no-break">
        <div className="pr-section-label">Literacy Marks</div>
        <div style={{fontFamily:"sans-serif",fontSize:"12px",color:"#555",marginBottom:"10px",lineHeight:"1.6"}}>
          The table below shows how your response was assessed across the four CUBE literacy criteria. Each criterion is scored out of the maximum for this question, with evidence drawn directly from your writing.
        </div>
        <table className="pr-table">
          <thead>
            <tr>
              <th>Criterion</th>
              <th className="center">Score</th>
              <th style={{textAlign:"left",width:"55%"}}>Evidence &amp; Comment</th>

          <div style={{textAlign:"right"}}>
            <span className="pr-score-total-val">{Math.min(score,maxScore)}</span>
            <span style={{fontFamily:"sans-serif",fontSize:"14px",color:"#444",marginLeft:"4px"}}>/ {maxScore} XP</span>
          </div>
        </div>
      </div>

      {/* ── SECTION 5: MEDALS + MISSION ── */}
      {(a.medals?.medal1 || a.medals?.medal2 || a.mission) && (
        <div className="pr-medals-section pr-no-break">
          <div className="pr-section-label">Strengths &amp; Next Steps</div>

          {a.medals?.medal1 && (
            <div style={{marginBottom:"12px"}}>
              <div style={{fontFamily:"sans-serif",fontSize:"13px",fontWeight:800,color:"#b8860b",marginBottom:"4px"}}>🥇 Strength — {a.medals.medal1.category}</div>
              <div style={{fontFamily:"Georgia,serif",fontSize:"13px",color:"#333",lineHeight:"1.6",paddingLeft:"28px"}}>
                You demonstrated this well with: <em>"{a.medals.medal1.quote}"</em>
              </div>
            </div>
          )}

          {a.medals?.medal2 && (
            <div style={{marginBottom:"12px"}}>
              <div style={{fontFamily:"sans-serif",fontSize:"13px",fontWeight:800,color:"#555",marginBottom:"4px"}}>🥈 Also well done — {a.medals.medal2.category}</div>
              <div style={{fontFamily:"Georgia,serif",fontSize:"13px",color:"#333",lineHeight:"1.6",paddingLeft:"28px"}}>

          {a.mission && (
            <div style={{marginBottom:"8px"}}>
              <div style={{fontFamily:"sans-serif",fontSize:"13px",fontWeight:800,color:"#c62828",marginBottom:"4px"}}>🎯 Suggestion for Improvement</div>
              <div style={{fontFamily:"Georgia,serif",fontSize:"13px",color:"#444",lineHeight:"1.6",paddingLeft:"28px",marginBottom:"8px"}}>
                To improve: {(a.mission.weakness||"").replace(/^(add|include|use|write|ensure|make sure)\s+/i,"")}
              </div>
              {a.mission.originalPhrase && a.mission.improvedVersion && (
                <div style={{paddingLeft:"28px"}}>
                  <div style={{fontFamily:"sans-serif",fontSize:"11px",color:"#c62828",fontWeight:700,marginBottom:"2px"}}>Instead of writing:</div>
                  <div style={{fontFamily:"Georgia,serif",fontSize:"12px",color:"#555",fontStyle:"italic",marginBottom:"8px"}}>"{a.mission.originalPhrase}"</div>
                  <div style={{fontFamily:"sans-serif",fontSize:"11px",color:"#2e7d32",fontWeight:700,marginBottom:"2px"}}>Try this:</div>
                  <div style={{fontFamily:"Georgia,serif",fontSize:"12px",color:"#2e7d32",fontStyle:"italic"}}>"{a.mission.improvedVersion}"</div>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* ── FOOTER ── */}
      <div className="pr-footer">
        <span>CUBE HSC Marking Coach · {subjectCode} · AI-assisted feedback — not official NESA marking</span>
        <span>{dateStr}</span>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [studentName, setStudentName] = useState(() => {
    try { return localStorage.getItem("cube_student_name") || ""; } catch { return ""; }
  });

  // Save name to localStorage whenever it changes
  useEffect(() => {
    try {
      if (studentName.trim()) localStorage.setItem("cube_student_name", studentName.trim());
    } catch {}
  }, [studentName]);
  const [phase, setPhase] = useState(0); // 0=upload, 2=results
  // ── GAMIFICATION STATE ──
  const [streak, setStreak] = useState(() => {
    try {
      const d = JSON.parse(localStorage.getItem("cube_streak") || "{}");
      const today = new Date().toDateString();
      const last  = d.lastDate;
      if (last === today) return d.count || 0;
      if (!last) return 0;
      const daysSince = Math.floor((new Date(today) - new Date(last)) / 86400000);
      // Decay: 1 day missed = half, 2 days = quarter, 3+ = zero
      const raw = d.count || 0;
      if (daysSince === 1) return Math.floor(raw / 2);
      if (daysSince === 2) return Math.floor(raw / 4);
      return 0;
    } catch { return 0; }
  });
  const [sessionXP, setSessionXP] = useState(0);
  const [cubeXP,    setCubeXP]    = useState(null);  // null = not yet assessed
  const [annoXP,    setAnnoXP]    = useState(null);
  const [writeXP,   setWriteXP]   = useState(null);
  const [stage1Done, setStage1Done] = useState(false);
  const [stage2Loading, setStage2Loading] = useState(false);
  const [stage2Error,   setStage2Error]   = useState(null);
  const [stage2Results, setStage2Results] = useState(null); // phase3_analysis from Call 2
  const [leaderboard, setLeaderboard]   = useState(null);  // fetched from LeaderboardWebhook
  const [lbLoading,   setLbLoading]     = useState(false);
  const [lbError,     setLbError]       = useState(null);
  const [lbPeriod,    setLbPeriod]      = useState("week");
  const [lbDirective, setLbDirective]   = useState("all");
  const [annotationIdeas, setAnnotationIdeas] = useState([]); // from stage 1 planningArrows labels
  const [iterCount,  setIterCount]  = useState(1);    // Stage 1 attempt number
  const [sessionId,  setSessionId]  = useState("");    // shared by Stage1+Stage2 for same attempt

  // persist streak on submit
  const bumpStreak = () => {
    try {
      const today = new Date().toDateString();
      const d = JSON.parse(localStorage.getItem("cube_streak") || "{}");
      const last = d.lastDate;
      let count;
      if (last === today) {
        count = d.count || 0; // already counted today
      } else if (!last) {
        count = 1;
      } else {
        const daysSince = Math.floor((new Date(today) - new Date(last)) / 86400000);
        const prev = d.count || 0;
        if (daysSince === 1) count = prev + 1;          // consecutive
        else if (daysSince === 2) count = Math.max(1, Math.floor(prev / 2) + 1); // half + 1
        else if (daysSince === 3) count = Math.max(1, Math.floor(prev / 4) + 1); // quarter + 1
        else count = 1;                                  // fully reset
      }
      localStorage.setItem("cube_streak", JSON.stringify({count, lastDate: today}));
      setStreak(count);
    } catch {}
  };

  // Compute CUBE XP: student's score from their actual markings (from studentCube.score)
  // maxCubeXP is computed separately from the question elements
  const computeCubeXP = (parsed) => {
    // Student's actual earned XP = what they correctly circled/underlined/boxed
    return parsed?.studentCube?.score ?? 0;
  };
  const computeMaxCubeXP = (parsed) => {
    // Maximum possible XP = number of CUBE elements in the question
    const c = parsed?.phase1_cube;
    if (!c) return 0;
    const dirs = c.directives?.length ? c.directives : c.directive ? [c.directive] : [];
    const kwds = c.syllabusKeywords?.length ? c.syllabusKeywords : [];
    return dirs.length + (kwds.length) + (c.constraints||[]).length + (c.evidenceRequired?1:0);
  };
  const [pageImg, setPageImg] = useState(null);

  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState("");
  const [error, setError] = useState(null);
  const [activeTab, setActiveTab] = useState("cube");
  const [showOptional, setShowOptional] = useState(false);
  const [modelAnswer, setModelAnswer] = useState(null);
  const [modelLoading, setModelLoading] = useState(false);
  const fileRef = useRef();
  const abortRef = useRef(null);

  // ── Shared file processor — used by file input, paste, and drag-drop ──
  const handleFileFromSource = async (f) => {
    if (!f || !f.type.startsWith("image/")) { setError("Please provide an image file (JPG, PNG, etc)."); return; }
    const p = studentName.trim().split(/\s+/).filter(Boolean);
    const nameValid = p.length >= 2 && p[p.length-1].length === 1;
    if (!nameValid) { setError("Please enter your first name and the first initial of your surname before uploading — e.g. Sue W"); return; }
    const url = URL.createObjectURL(f);
    const b64 = await toB64(f);
    setPageImg(url);
    setPageB64(b64);
    setError(null);
    setQuestionsOnPage(null);
    setQuestionNumber("");
    try {
      const scanRes = await fetch("https://cube-proxy.alan-3e2.workers.dev/", {
        method:"POST",
        headers:{"Content-Type":"application/json","X-Student-Name": encodeURIComponent(privacyName(studentName.trim()||"anonymous")),"X-Question-Number": encodeURIComponent(sanitiseInput(questionNumber))},
        body: JSON.stringify({
          model:"claude-haiku-4-5-20251001", max_tokens:200,
          messages:[{ role:"user", content:[
            { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:b64 }},
            { type:"text", text:`Look at this worksheet image. List all question numbers visible (e.g. Q1, Q2, Question 3, (a), (b) etc).
Return ONLY a JSON array of strings, e.g. ["1","2","3"] or ["a","b","c"]. No other text.` }
          ]}]
        })
      });
      const scanData = await scanRes.json();
      if (!scanRes.ok || scanData.error) { console.error("Scan error:", JSON.stringify(scanData)); setQuestionsOnPage(["1","2","3","4","5","6"]); return; }
      const raw = scanData.content?.[0]?.text?.trim() || "[]";
      const clean = raw.replace(/```json|```/g,"").trim();
      const arr = JSON.parse(clean);
      setQuestionsOnPage(Array.isArray(arr) && arr.length > 0 ? arr : ["1","2","3","4","5","6"]);
    } catch(err) {
      console.error("Scan catch:", err);
      setQuestionsOnPage(["1","2","3","4","5","6"]);
    }
  };

  const handleImg = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    e.target.value = "";
    await handleFileFromSource(f);
  };

  // ── Paste anywhere on the page to upload a screenshot ──
  React.useEffect(() => {
    const onPaste = (e) => {
      if (phase !== 0 || pageImg) return; // only on upload screen, no image yet
      const items = Array.from(e.clipboardData?.items || []);
      const imgItem = items.find(it => it.type.startsWith("image/"));
      if (!imgItem) return;
      e.preventDefault();
      handleFileFromSource(imgItem.getAsFile());
    };
    window.addEventListener("paste", onPaste);
    return () => window.removeEventListener("paste", onPaste);

  const [dragOver, setDragOver] = React.useState(false);

  const cancelAndReset = () => {

    setLoadingMsg("");
    setPageImg(null);
    setPageB64(null);

  const analyse = async () => {
    if (!pageB64) { setError("Please upload a photo first."); return; }

                              // Build regex: match keyword stem (first 5+ chars) case-insensitively
                              const stem = kwWord.split(" ")[0].slice(0,Math.max(5,kwWord.split(" ")[0].length-2));

                                const re = new RegExp(`(${stem}\\S*)`, "gi");

                  {/* ── Combined judgement row: IS/IS NOT linked directly to arguments ── */}
                  <div style={{marginBottom:"8px"}}>
                    <div style={{display:"flex",gap:"10px",alignItems:"center",fontSize:"13px",fontFamily:"sans-serif",marginBottom:"4px"}}>
                      <Tick ok={a.specialCheck.assessEvalCheck.hasJudgement&&a.specialCheck.assessEvalCheck.judgementLinked}/>
                      <span style={{color:"#e8eaf0",fontWeight:600}}>Judgement — IS or IS NOT linked directly to your arguments</span>
                    </div>
                    {(()=>{
                      const ec = a.specialCheck.assessEvalCheck;
                      const proSnip  = ec.proText  ? ec.proText.split("...")[0].slice(0,60)  : null;
                      const conSnip  = ec.conText  ? ec.conText.split("...")[0].slice(0,60)  : null;
                      const judgeText = ec.judgementText;
                      if (judgeText && (proSnip || conSnip)) {
                        const eg = [conSnip?"Despite "+conSnip:null, "it "+judgeText, proSnip?"because "+proSnip:null].filter(Boolean).join(" ");
                        return <div style={{marginLeft:"26px",color:"#ffccbc",fontSize:"13px",fontFamily:"sans-serif",fontStyle:"italic",lineHeight:"1.6"}}>
                          <div style={{marginBottom:"3px",color:"#888",fontSize:"11px",fontStyle:"normal"}}>Your judgement:</div>
                          "{judgeText}"
                          <div style={{marginTop:"6px",color:"#888",fontSize:"11px",fontStyle:"normal"}}>Stronger linked version example:</div>
                          "{eg}"
                        </div>;
                      }
                      return judgeText ? <div style={{marginLeft:"26px",color:"#ffccbc",fontSize:"15px",fontStyle:"italic",fontFamily:"sans-serif"}}>"{judgeText}"</div> : null;
                    })()}
                  </div>
                  <div style={{marginTop:"8px",color:"#ffccbc",fontSize:"13px",fontFamily:"sans-serif",lineHeight:"1.6"}}>{a.specialCheck.assessEvalCheck.comment}</div>
                </>}
              </Card>}
              {/* ── Band 6 example — at very bottom so student reviews their work first ── */}
              <div style={{marginTop:"8px",paddingTop:"16px",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                {!modelAnswer&&<>
                  <div style={{fontSize:"12px",color:"#9aabb8",fontFamily:"sans-serif",lineHeight:"1.5",marginBottom:"10px",textAlign:"center"}}>
                    ✅ Once you've reviewed all your feedback above —
                  </div>
                  <button onClick={generateModelAnswer} disabled={modelLoading} style={{width:"100%",padding:"12px",background:modelLoading?"#1a2a3a":`linear-gradient(90deg,${gold},#e8c96a)`,color:modelLoading?"#5a7a9a":"#040d18",border:"none",borderRadius:"10px",fontSize:"14px",fontWeight:800,cursor:modelLoading?"not-allowed":"pointer",fontFamily:"sans-serif"}}>
                    {modelLoading ? <span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"10px"}}><span className="cube-spinner"></span>Generating...</span> : "✨ Show me an indicative Band 6 example answer — not to copy"}
                  </button>
                </>}
                {modelAnswer&&<>
                  <div style={{marginBottom:"8px",fontSize:"11px",color:"#c9a84c",fontWeight:800,letterSpacing:"1px",fontFamily:"sans-serif"}}>
                    ✨ INDICATIVE BAND 6 EXAMPLE ANSWER
                  </div>
                  <PaperCard subtitle="">
                    <div style={{fontSize:"15px",lineHeight:"1.9",color:"#1a1a2e",fontFamily:"'Georgia',serif"}}>{modelAnswer}</div>
                  </PaperCard>
                  <div style={{fontSize:"12px",color:"#9ab",fontFamily:"sans-serif",fontStyle:"italic",marginTop:"6px"}}>This is an AI-generated example — use it to understand Band 6 depth and structure, not to copy.</div>
                </>}
              </div>


            </div>}
            </div>}

            {/* ═══ TAB: RANK (Step 7) ═══ */}
            {activeTab==="rank"&&<div>
              <SectionTitle>🏆 LEADERBOARD</SectionTitle>

              {/* Period + Directive filters */}
              <div style={{display:"flex",gap:"8px",marginBottom:"10px",flexWrap:"wrap"}}>
                {["week","alltime","improved"].map(p=>(
                  <button key={p} onClick={()=>{ setLbPeriod(p); fetchLeaderboard(p, lbDirective); }}
                    style={{padding:"7px 14px",borderRadius:"8px",border:"1.5px solid",fontSize:"12px",fontWeight:700,cursor:"pointer",fontFamily:"sans-serif",
                      borderColor: lbPeriod===p ? "#6c63ff" : "#2a2d3e",
                      background:  lbPeriod===p ? "rgba(108,99,255,0.2)" : "rgba(255,255,255,0.04)",
                      color:       lbPeriod===p ? "#a89fff" : "#9aabb8"
                    }}>
                    {p==="week"?"This Week":p==="alltime"?"All Time":"Most Improved"}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",gap:"6px",marginBottom:"14px",flexWrap:"wrap"}}>
                {[
                  {id:"all",    label:"All questions",     color:"#e8eaf0", border:"#3a3d4e", bg:"rgba(255,255,255,0.06)"},
                  {id:"explain",label:"Explain / Analyse", color:"#64b5f6", border:"#1565c0", bg:"rgba(100,181,246,0.1)"},
                  {id:"assess", label:"Assess / Evaluate", color:"#ff8a65", border:"#bf360c", bg:"rgba(255,138,101,0.1)"},
                  {id:"other",  label:"Other",             color:"#81c784", border:"#2e7d32", bg:"rgba(165,214,167,0.1)"},
                ].map(d=>(
                  <button key={d.id} onClick={()=>{ setLbDirective(d.id); fetchLeaderboard(lbPeriod, d.id); }}
                    style={{padding:"5px 12px",borderRadius:"8px",border:"1.5px solid",fontSize:"11px",fontWeight:800,cursor:"pointer",fontFamily:"sans-serif",
                      borderColor: lbDirective===d.id ? d.color : d.border,
                      background:  lbDirective===d.id ? d.bg : "rgba(255,255,255,0.02)",
                      color: d.color
                    }}>
                    {d.label}
                  </button>
                ))}
              </div>
              {config.leaderboardTip&&<div style={{background:"rgba(100,181,246,0.08)",border:"1px solid #1565c0",borderRadius:"8px",padding:"8px 12px",marginBottom:"12px",fontSize:"11px",color:"#64b5f6",fontFamily:"sans-serif"}}>
                💡 <strong>{config.subjectCode} tip:</strong> {config.leaderboardTip}
              </div>}

              {/* Loading */}
              {lbLoading&&<div style={{textAlign:"center",padding:"32px",color:"#9aabb8",fontFamily:"sans-serif"}}>
                <div className="cube-spinner" style={{marginBottom:"12px"}}></div>
                <div>Loading leaderboard...</div>
              </div>}

              {/* Error */}
              {lbError&&!lbLoading&&<div style={{background:"rgba(244,67,54,0.08)",border:"1px solid rgba(244,67,54,0.4)",borderRadius:"10px",padding:"14px",marginBottom:"12px",fontFamily:"sans-serif"}}>
                <div style={{color:"#ff8a80",fontSize:"13px",marginBottom:"8px"}}>{lbError}</div>
                <button onClick={()=>fetchLeaderboard(lbPeriod,lbDirective)} style={{padding:"6px 16px",background:"rgba(244,67,54,0.2)",border:"1px solid rgba(244,67,54,0.4)",borderRadius:"8px",color:"#ff8a80",fontSize:"12px",cursor:"pointer",fontFamily:"sans-serif"}}>Retry</button>
              </div>}

              {/* Leaderboard list */}
              {leaderboard&&!lbLoading&&(()=>{
                const board = lbPeriod==="improved"
                  ? (leaderboard.leaderboard||[])
                  : (leaderboard.leaderboard||[]);
                const me = privacyName(studentName.trim()||"");

                return <div>
                  {/* Podium — top 3 */}
                  {board.length>=3&&<div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:"10px",marginBottom:"18px",paddingBottom:"4px"}}>
                    {[board[1],board[0],board[2]].map((p,pi)=>{
                      const sizes   = [52,64,42];
                      const heights = [38,52,28];
                      const colors  = ["#607d8b","linear-gradient(135deg,#c9a84c,#e8c96a)","#795548"];
                      const txtColors= ["white","#040d18","white"];
                      const ranks   = [2,1,3];
                      const isMe    = p.student===me;
                      return <div key={pi} style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                        {pi===1&&<div style={{fontSize:"18px",marginBottom:"2px"}}>👑</div>}
                        <div style={{width:`${sizes[pi]}px`,height:`${sizes[pi]}px`,borderRadius:"50%",
                          background: isMe?"linear-gradient(135deg,#6c63ff,#9c27b0)":p.colour||"#607d8b",
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontSize:`${pi===1?17:13}px`,fontWeight:900,color:"white",
                          marginBottom:"4px",border:isMe?"2px solid #a89fff":"none"}}>
                          {(p.student||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()}
                        </div>
                        <div style={{fontSize:"10px",fontWeight:700,color:"#e8eaf0",fontFamily:"sans-serif",marginBottom:"2px",maxWidth:"60px",textAlign:"center",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.student}</div>
                        <div style={{fontSize:"9px",color:"#a89fff",fontFamily:"sans-serif",marginBottom:"3px"}}>{p.totalXP} XP</div>
                        <div style={{width:`${sizes[pi]+10}px`,height:`${heights[pi]}px`,background:colors[pi],borderRadius:"6px 6px 0 0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",fontWeight:900,color:txtColors[pi]}}>
                          {ranks[pi]}
                        </div>
                      </div>;
                    })}
                  </div>}

                  {/* Full list */}
                  {board.map((p,i)=>{
                    const isMe = p.student===me;
                    const initials = (p.student||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
                    return <div key={i} style={{display:"flex",alignItems:"center",gap:"10px",padding:"10px 12px",
                      borderRadius:"10px",marginBottom:"6px",fontFamily:"sans-serif",
                      background: isMe?"rgba(108,99,255,0.08)":"rgba(255,255,255,0.03)",
                      border: isMe?"1.5px solid #6c63ff44":"1px solid rgba(255,255,255,0.08)"}}>
                      <div style={{fontSize:"14px",fontWeight:900,color:i<3?"#c9a84c":"#555",width:"18px",textAlign:"center",flexShrink:0}}>{p.rank}</div>
                      <div style={{width:"36px",height:"36px",borderRadius:"50%",flexShrink:0,
                        background: isMe?"linear-gradient(135deg,#6c63ff,#9c27b0)":p.colour||"#607d8b",
                        display:"flex",alignItems:"center",justifyContent:"center",
                        fontSize:"12px",fontWeight:900,color:"white"}}>
                        {initials}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:"13px",fontWeight:800,color:"#e8eaf0",display:"flex",alignItems:"center",gap:"6px"}}>
                          {p.student}
                          {isMe&&<span style={{fontSize:"9px",background:"#6c63ff",color:"white",padding:"1px 7px",borderRadius:"10px",fontWeight:700}}>YOU</span>}
                          {p.streak>0&&<span style={{fontSize:"11px"}}>🔥 {p.streak}</span>}
                          {lbPeriod==="improved"&&p.improvement&&<span style={{fontSize:"10px",color:"#69f0ae",fontWeight:700}}>+{p.improvement} XP</span>}
                        </div>
                        <div style={{fontSize:"10px",color:"#9aabb8",marginTop:"2px",display:"flex",gap:"10px"}}>
                          <span>✅ {p.annotatedCount} question{p.annotatedCount!==1?"s":""} fully marked</span>
                        </div>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        {isMe&&<div style={{fontSize:"9px",color:"#9aabb8",fontFamily:"sans-serif",marginBottom:"2px",whiteSpace:"nowrap"}}>Your total score</div>}
                        <div style={{fontSize:isMe?"26px":"16px",fontWeight:900,color:"#a89fff",lineHeight:1}}>{p.totalXP}</div>
                        <div style={{fontSize:"9px",color:"#555"}}>XP</div>
                      </div>
                    </div>;
                  })}

                  {board.length===0&&<div style={{textAlign:"center",padding:"24px",color:"#9aabb8",fontFamily:"sans-serif",fontSize:"13px"}}>
                    No submissions yet for this filter. Be the first! 🚀
                  </div>}

                  {/* Class stats */}
                  {leaderboard.classStats&&<div style={{marginTop:"14px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:"12px",padding:"12px 14px"}}>
                    <div style={{fontSize:"10px",color:"#9aabb8",textTransform:"uppercase",letterSpacing:"1px",fontWeight:700,marginBottom:"10px",fontFamily:"sans-serif"}}>📊 Class {lbPeriod==="week"?"This Week":"Stats"}</div>
                    <div style={{display:"flex",gap:"8px"}}>
                      {[
                        {val:leaderboard.classStats.submissions,  label:"Questions fully marked", color:"#69f0ae"},
                        {val:leaderboard.classStats.explainCount, label:"Explain / Analyse",      color:"#64b5f6"},
                        {val:leaderboard.classStats.assessCount,  label:"Assess / Evaluate",      color:"#ff8a65"},
                        {val:leaderboard.classStats.otherCount,   label:"Other directive",         color:"#ce93d8"},
                      ].map((s,i)=>(
                        <div key={i} style={{flex:1,background:"rgba(255,255,255,0.03)",borderRadius:"8px",padding:"8px 4px",textAlign:"center"}}>
                          <div style={{fontSize:"18px",fontWeight:900,color:s.color}}>{s.val}</div>
                          <div style={{fontSize:"8px",color:"#9aabb8",marginTop:"2px",lineHeight:1.3,fontFamily:"sans-serif",whiteSpace:"pre-line"}}>{s.label}</div>
                        </div>
                      ))}
                    </div>
                  </div>}
                </div>;
              })()}

            </div>}

          </div>;
        })()}
      </div>

      {/* ── PRINT REPORT PORTAL — hidden on screen, visible only when printing ── */}
      {phase===2&&stage2Results&&results&&(()=>{
        const { phase1_cube: cPr } = results;
        const aPr = stage2Results;
        const dirsPr = cPr.directives?.length ? cPr.directives : cPr.directive ? [cPr.directive] : [];
        const kwdsPr = cPr.syllabusKeywords?.length ? cPr.syllabusKeywords : cPr.syllabusMatch ? [cPr.syllabusMatch] : [];
        const primaryDirPr = dirsPr.find(d=>d.isPrimary)||dirsPr[0]||{};
        const verbTypePr = primaryDirPr.verbType||"other";
        const causalDirWordPr = dirsPr.length ? (dirsPr.find(d=>d.isPrimary)||dirsPr[0])?.word?.toLowerCase().trim()||"" : "";
        const causalDirObjPr  = config.directiveTiers[causalDirWordPr]||config.directiveTiers[causalDirWordPr.replace("critically ","")];
        const causalApplicablePr = causalDirObjPr ? (causalDirObjPr.tier===3||causalDirObjPr.tier===4) : (aPr?(aPr.rubric?.causalConnectives?.applicable!==false):true);
        const dirWordPr = causalDirWordPr;
        const dirObjPr  = config.directiveTiers[dirWordPr]||config.directiveTiers[dirWordPr.replace("critically ","")]||config.directiveTiers[verbTypePr]||config.directiveTiers[verbTypePr?.replace("critically ","")];
        const modalityApplicablePr = dirObjPr ? (dirObjPr.modality==="required"||dirObjPr.modality==="optional") : ["assess","evaluate","critically evaluate"].includes(verbTypePr)?true:(aPr?aPr.rubric?.modality?.applicable===true:false);
        const dimMaxPr = (cPr.marks!=null&&cPr.marks!=="") ? (cPr.marks<=2?2:cPr.marks<=4?3:cPr.marks<=6?4:5) : 3;
        const scorePr = totalScore(aPr, causalApplicablePr, modalityApplicablePr, dimMaxPr);
        const maxScorePr = (dimMaxPr*2)+(causalApplicablePr?dimMaxPr:0)+(modalityApplicablePr?dimMaxPr:0);
        const prContainer = document.getElementById("print-report");
        if (!prContainer) return null;
        return ReactDOM.createPortal(
          <PrintReport
            studentName={studentName.trim()||"Student"}
            questionNumber={questionNumber}
            subjectName={config.subjectName}
            subjectCode={config.subjectCode}
            dirs={dirsPr}
            kwds={kwdsPr}
            c={cPr}
            a={aPr}
            score={scorePr}
            maxScore={maxScorePr}
            dimMaxR={dimMaxPr}
            causalApplicable={causalApplicablePr}
            modalityApplicable={modalityApplicablePr}
            stage2Results={stage2Results}
            connectives={config.connectives}
          />,
          prContainer
        );
      })()}
    </div>
  );
}


// ─── APP SHELL — waits for config.json before rendering ──────────────────────
function AppShell() {
  const [configReady, setConfigReady] = useState(false);
  const [configError, setConfigError] = useState(null);

  useEffect(() => {
    loadConfig().then(() => {
      if (!config.subjectCode) {
        setConfigError("Config file loaded but missing subjectCode — check your config JSON.");
      }
      setConfigReady(true);
    }).catch(e => {
      setConfigError("Could not load config: " + e.message);
      setConfigReady(true); // still render with defaults
    });
  }, []);

  if (!configReady) {
    return (
      <div style={{minHeight:"100vh",background:"#040d18",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:"16px"}}>
        <div style={{width:"32px",height:"32px",border:"3px solid rgba(201,168,76,0.25)",borderTopColor:"#c9a84c",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}></div>
        <div style={{color:"#c9a84c",fontFamily:"sans-serif",fontSize:"14px"}}>Loading subject config...</div>
        <style>{`@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
      </div>
    );
  }

  if (configError) {
    return (
      <div style={{minHeight:"100vh",background:"#040d18",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{background:"rgba(244,67,54,0.1)",border:"1px solid rgba(244,67,54,0.4)",borderRadius:"12px",padding:"24px",maxWidth:"500px",fontFamily:"sans-serif"}}>
          <div style={{color:"#ff8a80",fontSize:"16px",fontWeight:700,marginBottom:"8px"}}>⚠️ Configuration Error</div>
          <div style={{color:"#e8eaf0",fontSize:"13px"}}>{configError}</div>
        </div>
      </div>
    );
  }

  return <App />;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(AppShell));
  </script>
</body>
</html>
