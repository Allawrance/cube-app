  <script>
  /* Mobile detection — UA-based as well as width, because inside the Google Sites
     embed iframe the reported window width is desktop-sized even on a phone, so
     width-only checks and CSS media queries never fire there. build 2026-07-07 · proceduralTrack-v1.7 */
  (function(){
    var UA_MOBILE = /Android|iPhone|iPod|Windows Phone|Mobile/i.test(navigator.userAgent);
    function isMob(){ return UA_MOBILE || window.innerWidth <= 640; }
    function apply(){ document.documentElement.classList.toggle("mobile-ui", isMob()); }
    apply();
    window.addEventListener("resize", apply);
    window.CUBE_IS_MOBILE = isMob;
  })();
  </script>

  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; } body { background: #040d18; }
  .hide-mobile { display: inline; }
  .show-mobile { display: none; }
  html.mobile-ui .hide-mobile { display: none; }
  html.mobile-ui .show-mobile { display: inline; }
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0px 1000px rgba(30, 50, 40, 0.9) inset !important;
    -webkit-text-fill-color: #f0e6c8 !important;
    transition: background-color 5000s ease-in-out 0s;
  }
  @keyframes borderPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.5); }
    50%       { box-shadow: 0 0 0 6px rgba(201,168,76,0.0); }

  /* ── PRINT / PDF REPORT ─────────────────────────────────────────────────── */
  #print-report { display: none; }

  @media print {
    /* Hide everything except the report */
    body > #root { display: none !important; }
    #print-report {
      display: block !important;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #1a1a2e;
      background: white;
      padding: 0;
      margin: 0;
    }
    /* Force white background, black text throughout */
    #print-report * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* Page breaks */
    .pr-page-break { page-break-before: always; }
    .pr-no-break   { page-break-inside: avoid; }

    /* Header */
    .pr-header {
      background: #040d18 !important;
      color: white !important;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid #c9a84c;
      margin-bottom: 24px;
    }
    .pr-header-left { display: flex; align-items: center; gap: 16px; }
    .pr-cube-badge {
      background: #c9a84c !important;
      color: #040d18 !important;
      border-radius: 8px;
      padding: 6px 14px;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 4px;
      font-family: sans-serif;
    }
    .pr-header-title { font-size: 18px; font-weight: 700; color: #f0e6c8 !important; font-family: sans-serif; }
    .pr-header-sub   { font-size: 12px; color: #c8d8e8 !important; font-family: sans-serif; margin-top: 2px; }
    .pr-header-meta  { text-align: right; font-family: sans-serif; font-size: 11px; color: #9aabb8 !important; }

    /* Section headings */
    .pr-section-label {
      font-family: sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c9a84c !important;
      margin-bottom: 8px;
    }

    /* Question block */
    .pr-question-block {
      border: 2px solid #c9a84c;
      border-radius: 10px;
      padding: 14px 18px;
      margin: 0 28px 20px;
      background: #fffef8 !important;
    }
    .pr-question-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }
    .pr-directive-pill {
      border: 2.5px solid #c0392b;
      border-radius: 50%;
      padding: 2px 10px;
      color: #c0392b !important;
      font-weight: 900;
      font-size: 13px;
      font-family: sans-serif;
    }
    .pr-score-pill {
      background: #c9a84c !important;
      color: #040d18 !important;
      border-radius: 20px;
      padding: 3px 14px;
      font-size: 13px;
      font-weight: 900;
      font-family: sans-serif;
    }
    .pr-question-text {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.7;
      color: #1a1a2e !important;
    }

    /* CUBE SVG wrapper */
    .pr-cube-section { margin: 0 28px 20px; }
    .pr-cube-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-family: sans-serif;
      font-size: 12px;
      color: #444 !important;
    }

    /* Paper card (student response) */
    .pr-paper {
      margin: 0 28px 20px;
      background: #fffef5 !important;
      border-radius: 12px;
      border: 1px solid #d0c8a8;
      padding: 20px 24px;
      position: relative;
      overflow: hidden;

    .pr-paper-lines::before {
      content: '';
      position: absolute;
      left: 36px;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: rgba(255,100,100,0.25);
    }
    .pr-response-text {
      font-family: 'Georgia', serif;
      font-size: 12.5px;
      line-height: 1.65;
      color: #1a1a2e !important;
      position: relative;

    .pr-connective { color: #7b1fa2 !important; font-weight: 900; font-family: sans-serif; }
    .pr-noun-group { color: #1565c0 !important; font-style: italic; text-decoration: underline; text-decoration-style: dotted; }
    .pr-illegible  { background: #ff6d00 !important; color: white !important; border-radius: 3px; padding: 0 5px; font-size: 11px; font-family: sans-serif; font-weight: 900; }

    /* Literacy table */
    .pr-literacy-section { margin: 0 28px 20px; }
    .pr-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 12px; }
    .pr-table th { background: #f0e6c8 !important; color: #040d18 !important; padding: 10px 12px; text-align: left; font-weight: 800; letter-spacing: 0.5px; border-bottom: 2px solid #c9a84c; }
    .pr-table th.center { text-align: center; }
    .pr-table td { padding: 10px 12px; border-bottom: 1px solid #e8e0c8; vertical-align: top; color: #1a1a2e !important; }
    .pr-table td.center { text-align: center; }
    /* Annotation table */
    .pr-anno-section { margin: 0 28px 20px; }
    .pr-anno-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 12px; }
    .pr-anno-table th { background: #f0e6c8 !important; color: #040d18 !important; padding: 8px 10px; text-align: left; font-weight: 800; letter-spacing: 0.5px; border-bottom: 2px solid #c9a84c; }
    .pr-anno-table th.center { text-align: center; width: 48px; }
    .pr-anno-table td { padding: 7px 10px; border-bottom: 1px solid #f0e8d8; vertical-align: middle; color: #1a1a2e !important; }
    .pr-anno-table td.center { text-align: center; }
    .pr-anno-table tr:last-child td { border-bottom: none; }
    .pr-anno-idea { font-style: italic; font-weight: 600; color: #1a1a2e !important; }
    .pr-anno-evidence { font-size: 10px; color: #888 !important; margin-top: 2px; font-style: italic; }
    .pr-anno-tick { font-size: 13px; }
    .pr-anno-badge-dev { background: #e8f5e9 !important; color: #2e7d32 !important; border: 1px solid #81c784; border-radius: 4px; padding: 1px 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.5px; }
    .pr-anno-badge-men { background: #fff3e0 !important; color: #e65100 !important; border: 1px solid #ffb74d; border-radius: 4px; padding: 1px 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.5px; }
    .pr-anno-xp-row td { font-family: sans-serif; font-size: 11px; font-weight: 700; color: #444 !important; padding: 6px 10px; border-top: 2px solid #c9a84c; background: #f8f4ec !important; }

    .pr-score-circle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%;
      font-weight: 900; font-size: 12px; color: white !important;
      font-family: sans-serif;
    }
    .pr-na { color: #999 !important; font-style: italic; font-size: 12px; }

    /* Score summary */
    .pr-score-summary {
      margin: 0 28px 20px;
      background: #f0e6c8 !important;
      border-radius: 10px;
      padding: 14px 18px;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .pr-score-total-label { font-size: 13px; color: #666 !important; }
    .pr-score-total-val   { font-size: 28px; font-weight: 900; color: #040d18 !important; }

    /* Medals + Mission */
    .pr-medals-section { margin: 0 28px 20px; }
    .pr-medal-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .pr-medal-gold   { background: #fffbe6 !important; border: 1.5px solid #f0c040; }
    .pr-medal-silver { background: #f8f8f8 !important; border: 1.5px solid #bbb; }
    .pr-mission-box  { background: #fff3f3 !important; border: 1.5px solid #e57373; border-radius: 10px; padding: 14px 16px; }
    .pr-medal-emoji  { font-size: 24px; flex-shrink: 0; }
    .pr-medal-cat    { font-weight: 800; font-size: 14px; font-family: sans-serif; }
    .pr-medal-gold   .pr-medal-cat { color: #b8860b !important; }
    .pr-medal-silver .pr-medal-cat { color: #555 !important; }
    .pr-medal-quote  { font-style: italic; font-size: 13px; color: #333 !important; line-height: 1.5; margin-top: 4px; }
    .pr-mission-label  { font-weight: 800; font-size: 14px; color: #c62828 !important; font-family: sans-serif; margin-bottom: 6px; }
    .pr-mission-text   { font-size: 13px; color: #444 !important; line-height: 1.5; margin-bottom: 10px; }
    .pr-change-grid    { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pr-change-bad  { background: #fde8e8 !important; border: 1px solid #e57373; border-radius: 8px; padding: 8px 10px; }
    .pr-change-good { background: #e8f5e9 !important; border: 1px solid #81c784; border-radius: 8px; padding: 8px 10px; }
    .pr-change-label { font-size: 9px; font-weight: 800; letter-spacing: 1px; font-family: sans-serif; margin-bottom: 4px; }
    .pr-change-bad  .pr-change-label { color: #c62828 !important; }
    .pr-change-good .pr-change-label { color: #2e7d32 !important; }
    .pr-change-phrase { font-size: 12px; font-style: italic; color: #333 !important; }

    /* Footer */
    .pr-footer {
      margin: 24px 28px 0;
      padding-top: 12px;
      border-top: 1px solid #ddd;
      font-family: sans-serif;
      font-size: 10px;
      color: #999 !important;
      display: flex;
      justify-content: space-between;
    }
  }
</style>

  <script>
    // ─── SINGLE SOURCE OF TRUTH FOR BUILD VERSION ───────────────────────────
    // Change this ONE line each deploy. The console log AND the corner tag both
    // read from it, so the visible version can never drift out of sync again.
    window.CUBE_BUILD = "v3.9 · 2026-09-04 · stage1-whole-question-v2.0 · whole-question headings with stimulus boxes recognised · section preambles no longer disqualify a heading · self-contradictory questionNotFound retried once · parse-repair-v1.0 · wallet-v1.1 · classgate-v1.0";

    // Configure pdf.js worker
    if (typeof pdfjsLib !== 'undefined') {

  <script>
/* ── CUBE access-code wallet · wallet-v1.0 ─────────────────────── */
/* CUBE access-code wallet · wallet-v1.0 · 2026-08-27
   Self-contained. Only global is window.CUBEAccess.
   Stores MULTIPLE codes (one per subject) so a student taking several
   subjects enters each code once per device and never again.
   While ACCESS_GATE is off the modal offers "Continue without a code";
   that escape hatch disappears by itself the moment the gate is turned on,
   with no redeploy needed. */
window.CUBEAccess = (function () {
  "use strict";

  var STORE = "cubeAccessCodes";
  var STORE_V = 1;
  var GATE_CACHE = "cubeGateStatus";
  var WORKER = "https://cube-proxy.alan-3e2.workers.dev";

  /* Subject aliasing — the landing page, the coaches and CUBE_ACCESS do NOT
     all spell subjects the same way (BusS vs BS, HlthM vs HM, ComFam vs CF,
     EngS vs ES, Geo vs GEO ...). Mirrors KV_SUBJECT_MAP in the Worker. */
  var ALIAS = {
    EES: "EES",
    BIO: "BIO", BIOLOGY: "BIO",
    INVSCI: "INVSCI", INVESTIGATINGSCIENCE: "INVSCI",
    CHEM: "CHEM", CHEMISTRY: "CHEM",
    PHYS: "PHYS", PHYSICS: "PHYS",
    BS: "BS", BUSS: "BS", BUSINESSSTUDIES: "BS",
    HM: "HM", HLTHM: "HM",
    ES: "ES", ENGS: "ES",
    CF: "CF", COMFAM: "CF",
    LEG: "LEG", LEGAL: "LEG", LS: "LEG",
    VISART: "VISART", VA: "VISART", VISARTS: "VISART",
    ANCH: "ANCH", ANCHIST: "ANCH", AHIS: "ANCH", AHIST: "ANCH",
    MHIST: "MHIST", MODH: "MHIST", MODERNHIST: "MHIST", MODERNHISTORY: "MHIST",
    HOSP: "HOSP", HOSPITALITY: "HOSP",
    SOR2: "SOR2", SOR: "SOR2",
    ECON: "ECON", ECONOMICS: "ECON",
    GEO: "GEO", GEOGRAPHY: "GEO",
    MUS1: "MUS1", MUSIC1: "MUS1"
  };

  function canon(s) {
    var k = String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    return ALIAS[k] || k;
  }

  function normCode(s) {
    return String(s || "").toUpperCase().replace(/\s+/g, "").trim();
  }

  function normClass(s) {
    return String(s || "").trim().toUpperCase();
  }

  // wallet-v1.1 — the class the CURRENT PAGE is acting as (config.studentClass,
  // else the ?class= param). "" when the page carries no class.
  function pageClass() {
    try {
      return (window.config && window.config.studentClass) ||
             new URLSearchParams(window.location.search).get("class") || "";
    } catch (e) { return ""; }
  }

  // wallet-v1.1 — is per-class scoping on? Read from the cached /access status
  // (populated by gateStatus); default OFF so gate-off behaviour is unchanged.
  function classGateOn() {
    try {
      var d = JSON.parse(sessionStorage.getItem(GATE_CACHE) || "null");
      return !!(d && d.classGate);
    } catch (e) { return false; }
  }

  /* ── storage ─────────────────────────────────────────────────────────── */

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return [];
      var o = JSON.parse(raw);
      if (Array.isArray(o)) return o;                 // pre-v1 tolerance
      if (o && Array.isArray(o.codes)) return o.codes;
      return [];
    } catch (e) { return []; }
  }

  function save(list) {
    try {
      localStorage.setItem(STORE, JSON.stringify({ v: STORE_V, codes: list }));
    } catch (e) { /* private mode / quota — wallet degrades to per-session */ }
  }

  function all() { return load().slice(); }

  function codeFor(subject) {
    var want = canon(subject);
    if (!want) return "";
    var list = load();
    var gateOn = classGateOn();
    var pc = normClass(pageClass());
    for (var i = 0; i < list.length; i++) {
      if (canon(list[i].subject) !== want) continue;
      // wallet-v1.1 — when the class gate is on and BOTH the page and the held
      // code carry a class, they must match. A page with no class (browse /
      // whole cohort) never filters — mirrors the worker's fail-open.
      if (gateOn && pc !== "" && normClass(list[i].cls) !== "" && normClass(list[i].cls) !== pc) continue;
      return list[i].code || "";
    }
    return "";
  }

  function recordFor(subject) {
    var want = canon(subject);
    var list = load();
    var gateOn = classGateOn();
    var pc = normClass(pageClass());
    for (var i = 0; i < list.length; i++) {
      if (canon(list[i].subject) !== want) continue;
      if (gateOn && pc !== "" && normClass(list[i].cls) !== "" && normClass(list[i].cls) !== pc) continue;
      return list[i];
    }
    return null;
  }

  function put(rec) {
    if (!rec || !rec.code) return;
    var list = load();
    var code = normCode(rec.code);
    var subj = canon(rec.subject);
    // wallet-v1.1 — never the same code twice; when the class gate is on keep
    // one entry per (subject, class) so sibling classes coexist ("treated like
    // a new subject"), otherwise one per subject (v1.0 behaviour).
    var cls = normClass(rec.cls);
    var gateOn = classGateOn();
    list = list.filter(function (r) {
      if (normCode(r.code) === code) return false;
      if (gateOn) return !(canon(r.subject) === subj && normClass(r.cls) === cls);
      return canon(r.subject) !== subj;
    });
    list.push({
      code: code,
      subject: subj,
      cls: rec.cls || "",
      label: rec.label || "",
      t: Date.now()
    });
    save(list);
  }

  function forget(code) {
    var c = normCode(code);
    save(load().filter(function (r) { return normCode(r.code) !== c; }));
  }

  function clearAll() { save([]); }

  /* ── gate status (cached per tab) ─────────────────────────────────────── */

  function gateStatus() {
    var cached = null;
    try { cached = JSON.parse(sessionStorage.getItem(GATE_CACHE) || "null"); } catch (e) {}
    if (cached && typeof cached.gate === "string") return Promise.resolve(cached);
    return fetch(WORKER + "/access")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        try { sessionStorage.setItem(GATE_CACHE, JSON.stringify(d)); } catch (e) {}
        return d;
      })
      .catch(function () { return { gate: "off", accessBound: false, usageBound: false }; });
  }

  function gateIsOn() {
    return gateStatus().then(function (d) { return d && d.gate === "on"; });
  }

  /* ── validation against the Worker ────────────────────────────────────── */

  function validate(code) {
    var c = normCode(code);
    if (!c) return Promise.resolve({ ok: false, reason: "empty" });
    return fetch(WORKER + "/access?code=" + encodeURIComponent(c))
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
      .then(function (x) {
        var d = x.body || {};
        if (x.status === 200 && d.ok) {
          return { ok: true, code: c, kind: d.kind || "class", subject: d.subject || "", subjectName: d.subjectName || "", classGate: d.classGate || false, cls: d.class || "", label: d.label || "" };
        }
        return { ok: false, reason: d.error || "invalid" };
      })
      .catch(function () { return { ok: false, reason: "offline" }; });
  }

  /* ── modal ───────────────────────────────────────────────────────────── */

  var CSS_ID = "cube-access-css";
  var CSS = [
    '.cubeac-ov{position:fixed;inset:0;background:rgba(6,8,12,.82);backdrop-filter:blur(3px);',
    'z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:18px;}',
    '.cubeac-bx{background:#14171d;color:#e8eaf0;border:1px solid rgba(255,255,255,.14);border-radius:14px;',
    'max-width:420px;width:100%;padding:22px 22px 18px;box-shadow:0 18px 60px rgba(0,0,0,.6);',
    'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}',
    '.cubeac-h{font-size:17px;font-weight:800;margin:0 0 6px;color:#f0c14b;letter-spacing:.2px;}',
    '.cubeac-p{font-size:13.5px;line-height:1.5;margin:0 0 14px;color:#aeb4c0;}',
    '.cubeac-in{width:100%;box-sizing:border-box;padding:12px 13px;font-size:16px;letter-spacing:1.5px;',
    'text-transform:uppercase;background:#0d1015;color:#fff;border:1.5px solid rgba(255,255,255,.18);',
    'border-radius:9px;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}',
    '.cubeac-in:focus{border-color:#f0c14b;}',
    '.cubeac-in.bad{border-color:#e0553f;}',
    '.cubeac-msg{font-size:12.5px;min-height:17px;margin:8px 2px 0;color:#e0553f;line-height:1.4;}',
    '.cubeac-msg.ok{color:#5fd08a;}',
    '.cubeac-row{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;}',
    '.cubeac-b{flex:1;min-width:120px;padding:11px 14px;font-size:14px;font-weight:700;border-radius:9px;',
    'border:0;cursor:pointer;font-family:inherit;}',
    '.cubeac-b.go{background:#f0c14b;color:#1a1a1a;}',
    '.cubeac-b.go:disabled{opacity:.45;cursor:default;}',
    '.cubeac-b.sk{background:transparent;color:#8b93a1;border:1.5px solid rgba(255,255,255,.16);}',
    '.cubeac-sm{font-size:11.5px;color:#767d8b;margin-top:12px;line-height:1.45;}'
  ].join("");

// ─── APP SHELL — waits for config.json before rendering ──────────────────────
// ─── ERROR BOUNDARY ───────────────────────────────────────────────────────────
// Catches any render-time exception so a bad marking payload (e.g. a Chemistry
// procedural-track result the display doesn't yet handle) shows a readable card
// instead of a silent blank white screen. Permanent fix for "screen went blank".
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, message: "" }; }
  static getDerivedStateFromError(err) {
    return { hasError: true, message: (err && err.message) ? err.message : String(err) };
  }
  componentDidCatch(err, info) {
    console.error("CUBE render error:", err, info && info.componentStack);
  }
  render() {
    if (!this.state.hasError) return this.props.children;
    return (
      <div style={{minHeight:"100vh",background:"#040d18",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",fontFamily:"sans-serif"}}>
        <div style={{background:"rgba(244,67,54,0.08)",border:"1px solid rgba(244,67,54,0.4)",borderRadius:"14px",padding:"28px",maxWidth:"520px"}}>
          <div style={{color:"#ff8a80",fontSize:"18px",fontWeight:800,marginBottom:"10px"}}>Something went wrong displaying your marking</div>
          <div style={{color:"#e8eaf0",fontSize:"14px",lineHeight:"1.6",marginBottom:"18px"}}>
            The AI finished marking, but the result couldn't be shown. Your work wasn't lost — reload and try again. If it keeps happening on the same question, let your teacher know.
          </div>
          <div style={{color:"rgba(255,255,255,0.45)",fontSize:"12px",fontFamily:"monospace",marginBottom:"18px",wordBreak:"break-word"}}>{this.state.message}</div>
          <button onClick={() => window.location.reload()}
            style={{padding:"10px 20px",background:"rgba(201,168,76,0.2)",border:"1.5px solid rgba(201,168,76,0.6)",borderRadius:"10px",color:"#e9d9a3",fontSize:"14px",fontWeight:800,cursor:"pointer"}}>
            Reload and try again
          </button>
        </div>
      </div>
    );
  }
}
